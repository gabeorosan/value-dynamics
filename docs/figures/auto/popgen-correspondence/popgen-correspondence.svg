<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" preserveAspectRatio="xMidYMid meet" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="760" fill="white"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#2867b5"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5342c"/></marker></defs>
<text x="48" y="40.0" font-size="30" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Every term of the breeder's equation has a measured counterpart in the</text>
<text x="48" y="74.8" font-size="30" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">judging loop</text>
<text x="48" y="117.6" font-size="18" fill="#6b7684" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Borrowed equations, not borrowed biology: the same accounting of means applies.</text>
<line x1="48" y1="153" x2="1192" y2="153" stroke="#6b7684" stroke-width="1.5" opacity="0.45"/>
<text x="48" y="181.2" font-size="21" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">In selection theory: <tspan font-style="italic">R</tspan> = <tspan font-style="italic">h</tspan>² × <tspan font-style="italic">S</tspan></text>
<text x="428" y="181.2" font-size="21" fill="#2867b5" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">In this judging loop</text>
<rect x="48" y="224.98" width="300" height="112.25999999999999" rx="8" fill="white" stroke="#6b7684" stroke-width="2.5"/>
<text x="64" y="287.4" font-size="21" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Selection differential <tspan font-style="italic">S</tspan></text>
<rect x="428" y="224.98" width="764" height="112.25999999999999" rx="8" fill="#eaf1f8" stroke="#2867b5" stroke-width="2.5"/>
<text x="444" y="257.9" font-size="21" fill="#2867b5" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The selector gap</text>
<text x="444" y="295.2" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Mean value score of the two answers the judge keeps, minus the mean over all six</text>
<text x="444" y="319.7" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">candidates in that prompt's pool.</text>
<line x1="360" y1="281.11" x2="404" y2="281.11" stroke="#1a1a1a" stroke-width="4.5" marker-end="url(#arr)"/>
<rect x="48" y="351.24" width="300" height="112.25999999999999" rx="8" fill="white" stroke="#6b7684" stroke-width="2.5"/>
<text x="64" y="413.7" font-size="21" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Heritability <tspan font-style="italic">h</tspan>²</text>
<rect x="428" y="351.24" width="764" height="112.25999999999999" rx="8" fill="#eaf1f8" stroke="#2867b5" stroke-width="2.5"/>
<text x="444" y="384.2" font-size="21" fill="#2867b5" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">What the fine-tune carries over</text>
<text x="444" y="421.5" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The kept answers become the next fine-tune's training data: assumed to carry, never</text>
<text x="444" y="446.0" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">fitted here.</text>
<line x1="360" y1="407.37" x2="404" y2="407.37" stroke="#1a1a1a" stroke-width="4.5" marker-end="url(#arr)"/>
<rect x="48" y="477.5" width="300" height="112.25999999999999" rx="8" fill="white" stroke="#6b7684" stroke-width="2.5"/>
<text x="64" y="539.9" font-size="21" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Response to selection <tspan font-style="italic">R</tspan></text>
<rect x="428" y="477.5" width="764" height="112.25999999999999" rx="8" fill="#eaf1f8" stroke="#2867b5" stroke-width="2.5"/>
<text x="444" y="522.7" font-size="21" fill="#2867b5" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The change in measured value</text>
<text x="444" y="560.0" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">How far the organism's own value moves after that fine-tune.</text>
<line x1="360" y1="533.63" x2="404" y2="533.63" stroke="#1a1a1a" stroke-width="4.5" marker-end="url(#arr)"/>
<rect x="48.0" y="611.76" width="558.0" height="126.96000000000004" rx="8" fill="#eef5ee" stroke="#3a7d44" stroke-width="2.5"/>
<text x="193.486" y="659.8" font-size="16" fill="#3a7d44" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">differential row, checked</text>
<text x="68.0" y="659.8" font-size="34" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">R² 0.80</text>
<text x="68.0" y="687.8" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">of the realized gap, from spread × agreement, 367</text>
<text x="68.0" y="712.2" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">judge-scored rounds</text>
<rect x="634.0" y="611.76" width="558.0" height="126.96000000000004" rx="8" fill="#eef5ee" stroke="#3a7d44" stroke-width="2.5"/>
<text x="838.068" y="659.8" font-size="16" fill="#3a7d44" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">response row, checked</text>
<text x="654.0" y="659.8" font-size="34" fill="#1a1a1a" font-weight="bold" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">MAE 0.081</text>
<text x="654.0" y="687.8" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">of the kept-mean rule against the next measured value, 340</text>
<text x="654.0" y="712.2" font-size="18" fill="#1a1a1a" font-weight="normal" font-style="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">rounds; no-change baseline 0.128</text>
</svg>