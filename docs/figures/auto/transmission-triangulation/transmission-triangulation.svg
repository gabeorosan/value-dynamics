<text x="838.0" y="687.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">no interval computed</tspan></text>
<line x1="814.0" y1="786" x2="1085.6" y2="786" stroke="#b5342c" stroke-width="4" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
<text x="949.8" y="816.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">0.304 lower — 40% of the instrument's estimate missing</tspan></text>
<text x="949.8" y="840.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">(44% below the top lane)</tspan></text>
<text x="40.0" y="786.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">Hollow grey markers: the same fits before the measurement-error</tspan></text>
<text x="40.0" y="811.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">correction that removes noise shared by the pool-offset term and</tspan></text>
<text x="40.0" y="836.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the outcome. Only they carry bootstrap intervals.</tspan></text>
<text x="40.0" y="876.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">The top and bottom lanes use the same specification and the same estimator. What differs is the corpus — and with it, which runs were</tspan></text>
<text x="40.0" y="901.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">allowed to finish.</tspan></text>
<rect x="40" y="926" width="1320" height="366" rx="10" fill="#eef5ee" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="64.0" y="964.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Why the bottom lane reads low: the rule that ends a run takes the fastest movers out of the sample</tspan></text>
<text x="64.0" y="1000.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the stop reason recorded on those 28 runs, verbatim:</tspan></text>
<rect x="64" y="1012" width="680" height="72" rx="6" fill="#fdf6e8" stroke="#6b7684" stroke-width="2"/>
<text x="80.0" y="1044.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">round 3: no total is achievable by both arms (candidates too</tspan></text>
<text x="80.0" y="1070.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">value-uniform); pool means cannot be matched</tspan></text>
<text x="64.0" y="1108.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">(13 of 14 paired runs; the rest differ only in the round number)</tspan></text>
<text x="64.0" y="1140.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">Sensible as a pairing constraint — it stops a paired run once the two</tspan></text>
<text x="64.0" y="1165.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">arms can no longer be offered candidate pools whose means match. The</tspan></text>
<text x="64.0" y="1190.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">statistical consequence surfaced later.</tspan></text>
<text x="840.0" y="1000.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">runs the rule stopped — 28 runs, 62 rounds</tspan></text>
<rect x="840" y="1010" width="222.9" height="24" fill="#b5342c"/>
<text x="1074.9" y="1030.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">+0.074</tspan></text>
<text x="840.0" y="1074.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">runs that finished — 98 runs, 352 rounds</tspan></text>
<rect x="840" y="1084" width="58.1" height="24" fill="#1a1a1a"/>
<text x="910.1" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">+0.019</tspan></text>
<text x="840.0" y="1140.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">bar length: each run's mean change in measured value</tspan></text>
<text x="840.0" y="1165.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">per round, averaged over runs, on the rounds the</tspan></text>
<text x="840.0" y="1190.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">bottom lane is fitted on</tspan></text>
<line x1="64" y1="1210" x2="1336" y2="1210" stroke="#6b7684" stroke-width="1.5" opacity="0.55"/>
<text x="64.0" y="1242.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">Same direction in the near-uncensored unified corpus: the 4 runs that stop short give a round-1 response slope of 1.550 across their 8</tspan></text>
<text x="64.0" y="1267.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">round-1 records, against 0.721 for the 70 records from runs that complete.</tspan></text>
<text x="40.0" y="1326.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">Sources: experiments/response_saturation.json (unified corpus; measurement_error_correction.all and panels.all.M0_linear, run-clustered</tspan></text>
<text x="40.0" y="1350.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">bootstrap, 2000 draws) · experiments/spread_corpus_saturation.json (spread-intervention corpus; pooled, run-clustered bootstrap, 4000</tspan></text>
<text x="40.0" y="1374.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">draws) · abort split recomputed here from experiments/spread_intervention/output*/*.json · the instrumental-variables lane (Wald ratio,</tspan></text>
<text x="40.0" y="1398.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">first stage +0.1875, F = 35.1, SE 0.094) is quoted from docs/ANALYSIS_LEDGER.md section B; no result JSON holds it.</tspan></text>
