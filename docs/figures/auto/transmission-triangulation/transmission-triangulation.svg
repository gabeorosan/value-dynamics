<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1300" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="1300" fill="white"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5342c"/></marker></defs>
<text x="40.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Two estimates free of censoring agree at </tspan><tspan fill="#2867b5" font-weight="bold">0.75</tspan><tspan fill="#1a1a1a" font-weight="bold"> and </tspan><tspan fill="#2867b5" font-weight="bold">0.81</tspan><tspan fill="#1a1a1a" font-weight="bold">.</tspan></text>
<text x="40.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">The one fitted where the fast-moving runs were stopped early reads </tspan><tspan fill="#b5342c" font-weight="bold">0.45</tspan><tspan fill="#1a1a1a" font-weight="bold">.</tspan></text>
<text x="40.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">Transmission coefficient = how much of one round's selection differential actually shows up in the trained model's measured</tspan></text>
<text x="40.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">value. It is the coefficient on the selection gap in: (value after the round minus value before) ~ (candidate-pool mean minus</tspan></text>
<text x="40.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">value before) + selection gap, where the selection gap is the mean value of the answers the judge kept minus the mean value of</tspan></text>
<text x="40.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the pool it chose from, and the measured value is the share of held-out probe answers falling on the tracked value axis. On the</tspan></text>
<text x="40.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">scale below, the dashed line at 1.0 is the whole differential transmitted.</tspan></text>
<line x1="560.0" y1="264" x2="1190.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<line x1="644.0" y1="256" x2="644.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="644.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.4</tspan></text>
<line x1="728.0" y1="256" x2="728.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="728.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.5</tspan></text>
<line x1="812.0" y1="256" x2="812.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="812.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.6</tspan></text>
<line x1="896.0" y1="256" x2="896.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="896.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.7</tspan></text>
<line x1="980.0" y1="256" x2="980.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="980.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.8</tspan></text>
<line x1="1064.0" y1="256" x2="1064.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1064.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.9</tspan></text>
<line x1="1148.0" y1="256" x2="1148.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1148.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">1.0</tspan></text>
<line x1="566.0" y1="272" x2="574.0" y2="256" stroke="white" stroke-width="5"/>
<line x1="566.0" y1="272" x2="574.0" y2="256" stroke="#6b7684" stroke-width="2"/>
<line x1="575.0" y1="272" x2="583.0" y2="256" stroke="white" stroke-width="5"/>
<line x1="575.0" y1="272" x2="583.0" y2="256" stroke="#6b7684" stroke-width="2"/>
<text x="560.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the scale starts at 0.30, not 0</tspan></text>
<line x1="1148.0" y1="330" x2="1148.0" y2="742" stroke="#6b7684" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="941.4" y="330" width="45.9" height="412" fill="#eaf1f8"/>
<text x="964.3" y="302.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">the two estimates with no censoring</tspan></text>
<text x="964.3" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">land 0.055 apart</tspan></text>
<text x="40.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Unified corpus</tspan></text>
<text x="40.0" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">340 rounds from 74 runs</tspan></text>
<text x="40.0" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">ordinary regression, pool offset controlled</tspan></text>
<text x="40.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">4 of 74 runs stop short — almost no censoring</tspan></text>
<line x1="820.4" y1="418" x2="1151.2" y2="418" stroke="#6b7684" stroke-width="4" stroke-linecap="butt"/>
<line x1="820.4" y1="412.5" x2="820.4" y2="423.5" stroke="#6b7684" stroke-width="4"/>
<line x1="1151.2" y1="412.5" x2="1151.2" y2="423.5" stroke="#6b7684" stroke-width="4"/>
<circle cx="972.2" cy="418" r="9" fill="white" stroke="#6b7684" stroke-width="3"/>
<text x="985.8" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">uncorrected 0.791, interval [0.610, 1.004]</tspan></text>
<circle cx="987.3" cy="372" r="13" fill="#2867b5" stroke="white" stroke-width="3"/>
<text x="987.3" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">0.809</tspan><tspan fill="#6b7684" font-weight="normal">   no interval computed</tspan></text>
<text x="40.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Spread-intervention corpus</tspan></text>
<text x="40.0" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">36 matched round-1 pairs</tspan></text>
<text x="40.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">randomised instrument: round-1 arm assignment</tspan></text>
<text x="40.0" y="578.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">no censoring — round 1 precedes every abort</tspan></text>
<line x1="829.6" y1="522" x2="1134.6" y2="522" stroke="#2867b5" stroke-width="5" stroke-linecap="butt"/>
<line x1="829.6" y1="516.5" x2="829.6" y2="527.5" stroke="#2867b5" stroke-width="5"/>
<line x1="1134.6" y1="516.5" x2="1134.6" y2="527.5" stroke="#2867b5" stroke-width="5"/>
<polygon points="941.4,507 956.4,522 941.4,537 926.4,522" fill="#2867b5" stroke="white" stroke-width="3"/>
<text x="941.4" y="498.0" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">0.754</tspan></text>
<text x="982.1" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">95% CI [0.621, 0.984]</tspan></text>
<text x="974.7" y="580.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">quoted from the analysis ledger, not from a result file</tspan></text>
<text x="40.0" y="650.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Spread-intervention corpus</tspan></text>
<text x="40.0" y="676.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">414 rounds from 126 runs</tspan></text>
<text x="40.0" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">ordinary regression, pool offset controlled</tspan></text>
<text x="40.0" y="728.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">28 of 126 runs abort early — heavy censoring</tspan></text>
<line x1="659.8" y1="718" x2="784.0" y2="718" stroke="#6b7684" stroke-width="4" stroke-linecap="butt"/>
<line x1="659.8" y1="712.5" x2="659.8" y2="723.5" stroke="#6b7684" stroke-width="4"/>
<line x1="784.0" y1="712.5" x2="784.0" y2="723.5" stroke="#6b7684" stroke-width="4"/>
<circle cx="716.6" cy="718" r="9" fill="white" stroke="#6b7684" stroke-width="3"/>
<text x="761.6" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">uncorrected 0.486, interval [0.419, 0.567]</tspan></text>
<circle cx="686.0" cy="672" r="13" fill="#b5342c" stroke="white" stroke-width="3"/>
<text x="761.6" y="648.0" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">0.450</tspan><tspan fill="#6b7684" font-weight="normal">   no interval computed</tspan></text>
<line x1="686.0" y1="776" x2="941.4" y2="776" stroke="#b5342c" stroke-width="4" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
<text x="813.7" y="806.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">0.304 lower — 40% of the instrument's estimate missing</tspan></text>
<text x="813.7" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">(44% below the top lane)</tspan></text>
<text x="40.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">The top and bottom lanes use the same specification and the same estimator. What differs is the corpus — and with it,</tspan></text>
<text x="40.0" y="873.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">which runs were allowed to finish.</tspan></text>
<rect x="40" y="906" width="1160" height="316" rx="10" fill="#eef5ee" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="64.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Why the bottom lane reads low: the rule that ends a run takes the fastest movers out of the sample</tspan></text>
<text x="64.0" y="980.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the stop reason recorded on those 28 runs, verbatim:</tspan></text>
<rect x="64" y="992" width="556" height="98" rx="6" fill="#fdf6e8" stroke="#6b7684" stroke-width="2"/>
<text x="80.0" y="1024.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">round 3: no total is achievable by both arms</tspan></text>
<text x="80.0" y="1050.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">(candidates too value-uniform); pool means cannot be</tspan></text>
<text x="80.0" y="1076.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">matched</tspan></text>
<text x="64.0" y="1124.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">Sensible as a pairing constraint — it stops a paired run</tspan></text>
<text x="64.0" y="1149.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">once the two arms can no longer be offered candidate pools</tspan></text>
<text x="64.0" y="1174.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">whose means match. The statistical consequence surfaced</tspan></text>
<text x="64.0" y="1199.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">later.</tspan></text>
<text x="680.0" y="980.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">runs the rule stopped — 28 runs, 62 rounds</tspan></text>
<rect x="680" y="990" width="222.9" height="24" fill="#b5342c"/>
<text x="914.9" y="1010.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">+0.074</tspan></text>
<text x="680.0" y="1054.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">runs that finished — 98 runs, 352 rounds</tspan></text>
<rect x="680" y="1064" width="58.1" height="24" fill="#1a1a1a"/>
<text x="750.1" y="1084.0" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">+0.019</tspan></text>
<text x="680.0" y="1122.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">bars: each run's mean change in measured value per</tspan></text>
<text x="680.0" y="1147.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">round, averaged over runs, on the same rounds the</tspan></text>
<text x="680.0" y="1172.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">bottom lane is fitted on</tspan></text>
<text x="64.0" y="1164.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">Same direction in the near-uncensored unified corpus: the 4 runs that stop short give a round-1 response slope of</tspan></text>
<text x="64.0" y="1189.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">1.550 across their 8 round-1 records, against 0.721 for the 70 records from runs that complete.</tspan></text>
<text x="40.0" y="1256.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">Sources: experiments/response_saturation.json (unified corpus; measurement_error_correction.all and panels.all.M0_linear,</tspan></text>
<text x="40.0" y="1280.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">run-clustered bootstrap, 2000 draws) · experiments/spread_corpus_saturation.json (spread-intervention corpus; pooled,</tspan></text>
<text x="40.0" y="1304.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">run-clustered bootstrap, 4000 draws) · abort split recomputed here from experiments/spread_intervention/output*/*.json ·</tspan></text>
<text x="40.0" y="1328.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">the instrumental-variables lane (Wald ratio, first stage +0.1875, F = 35.1, SE 0.094) is quoted from</tspan></text>
<text x="40.0" y="1352.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">docs/ANALYSIS_LEDGER.md section B; no result JSON holds it.</tspan></text>
</svg>