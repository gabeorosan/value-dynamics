<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1424" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="1424" fill="white"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
 markerWidth="6" markerHeight="6" orient="auto-start-reverse">
 <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5342c"/></marker></defs>
<text x="40.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Two estimates free of censoring agree at </tspan><tspan fill="#2867b5" font-weight="bold">0.75</tspan><tspan fill="#1a1a1a" font-weight="bold"> and </tspan><tspan fill="#2867b5" font-weight="bold">0.81</tspan><tspan fill="#1a1a1a" font-weight="bold">.</tspan></text>
<text x="40.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">The one fitted where the fast-moving runs were stopped early reads </tspan><tspan fill="#b5342c" font-weight="bold">0.45</tspan><tspan fill="#1a1a1a" font-weight="bold">.</tspan></text>
<text x="40.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">Transmission coefficient = how much of one round's selection differential shows up in the trained model's measured value. It is the</tspan></text>
<text x="40.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">coefficient on the selection gap when the round's change in measured value is regressed on the pool offset and that gap. Selection gap</tspan></text>
<text x="40.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">= mean value of the answers the judge kept minus the mean value of the pool it chose from; measured value = share of held-out probe</tspan></text>
<text x="40.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">answers on the tracked value axis. Dashed line at 1.0 = the whole differential.</tspan></text>
<line x1="680.0" y1="264" x2="1350.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<line x1="769.3" y1="256" x2="769.3" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="769.3" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.4</tspan></text>
<line x1="858.7" y1="256" x2="858.7" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="858.7" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.5</tspan></text>
<line x1="948.0" y1="256" x2="948.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="948.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.6</tspan></text>
<line x1="1037.3" y1="256" x2="1037.3" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1037.3" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.7</tspan></text>
<line x1="1126.7" y1="256" x2="1126.7" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1126.7" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.8</tspan></text>
<line x1="1216.0" y1="256" x2="1216.0" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1216.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">0.9</tspan></text>
<line x1="1305.3" y1="256" x2="1305.3" y2="264" stroke="#6b7684" stroke-width="2.5"/>
<text x="1305.3" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">1.0</tspan></text>
<line x1="686.0" y1="272" x2="694.0" y2="256" stroke="white" stroke-width="5"/>
<line x1="686.0" y1="272" x2="694.0" y2="256" stroke="#6b7684" stroke-width="2"/>
<line x1="695.0" y1="272" x2="703.0" y2="256" stroke="white" stroke-width="5"/>
<line x1="695.0" y1="272" x2="703.0" y2="256" stroke="#6b7684" stroke-width="2"/>
<text x="680.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">scale starts at 0.30, not 0</tspan></text>
<line x1="1305.3" y1="336" x2="1305.3" y2="748" stroke="#6b7684" stroke-width="2" stroke-dasharray="4 7" opacity="0.75"/>
<rect x="1085.6" y="336" width="48.8" height="412" fill="#eaf1f8"/>
<text x="1110.0" y="302.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">the two estimates with no censoring</tspan></text>
<text x="1110.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">land 0.055 apart</tspan></text>
<text x="40.0" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Unified corpus</tspan></text>
<text x="40.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">340 rounds from 74 runs</tspan></text>
<text x="40.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">ordinary regression, pool offset controlled</tspan></text>
<text x="40.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">4 of 74 runs stop short — almost no censoring</tspan></text>
<line x1="957.0" y1="426" x2="1308.8" y2="426" stroke="#6b7684" stroke-width="4" stroke-linecap="butt"/>
<line x1="957.0" y1="420.5" x2="957.0" y2="431.5" stroke="#6b7684" stroke-width="4"/>
