<circle cx="1134.4" cy="380" r="13" fill="#2867b5" stroke="white" stroke-width="3"/>
<text x="1134.4" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">0.809</tspan></text>
<text x="1110.4" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="end" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">no interval computed</tspan></text>
<text x="40.0" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Spread-intervention corpus</tspan></text>
<text x="40.0" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">36 matched round-1 pairs</tspan></text>
<text x="40.0" y="560.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">randomised instrument: round-1 arm assignment</tspan></text>
<text x="40.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">no censoring — round 1 precedes every abort</tspan></text>
<line x1="966.8" y1="530" x2="1291.0" y2="530" stroke="#2867b5" stroke-width="5" stroke-linecap="butt"/>
<line x1="966.8" y1="524.5" x2="966.8" y2="535.5" stroke="#2867b5" stroke-width="5"/>
<line x1="1291.0" y1="524.5" x2="1291.0" y2="535.5" stroke="#2867b5" stroke-width="5"/>
<polygon points="1085.6,515 1100.6,530 1085.6,545 1070.6,530" fill="#2867b5" stroke="white" stroke-width="3"/>
<text x="1085.6" y="504.0" font-family="Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2867b5" font-weight="bold">0.754</tspan></text>
<text x="1128.9" y="564.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">95% CI [0.621, 0.984]</tspan></text>
<text x="1125.4" y="588.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">from the analysis ledger, not from a result file</tspan></text>
<text x="40.0" y="658.0" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="bold">Spread-intervention corpus</tspan></text>
<text x="40.0" y="684.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#6b7684" font-weight="normal">414 rounds from 126 runs</tspan></text>
<text x="40.0" y="710.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#1a1a1a" font-weight="normal">ordinary regression, pool offset controlled</tspan></text>
<text x="40.0" y="736.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan fill="#b5342c" font-weight="bold">28 of 126 runs abort early — heavy censoring</tspan></text>
<line x1="786.1" y1="726" x2="918.2" y2="726" stroke="#6b7684" stroke-width="4" stroke-linecap="butt"/>
<line x1="786.1" y1="720.5" x2="786.1" y2="731.5" stroke="#6b7684" stroke-width="4"/>
