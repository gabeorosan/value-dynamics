<text x="606" y="180" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#1a1a1a" font-weight="bold" text-anchor="start">The judge</text>
<text x="606" y="218" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6b7684" font-weight="normal" text-anchor="start">picks which of the six answers</text>
<text x="606" y="246" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6b7684" font-weight="normal" text-anchor="start">become the training data</text>
